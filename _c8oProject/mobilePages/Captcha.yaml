↓CaptchaDemoStyle [ngx.components.UIStyle-1787241206641]: 
  comment: Presentation styles for the palette-first CAPTCHA demonstration page.
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          ':host {
            --captcha-demo-ink: #172033;
            --captcha-demo-muted: #5b6475;
          }
          
          .captcha-demo-content {
            --background: linear-gradient(145deg, #f6f9ff 0%, #eef4fb 48%, #f8fafc 100%);
          }
          
          .captcha-demo-shell {
            width: min(720px, 100%);
            margin: 1.5rem auto;
          }
          
          .captcha-demo-heading {
            color: var(--captcha-demo-ink);
            margin: 0 0 .5rem;
          }
          
          .captcha-demo-lead,
          .captcha-demo-help {
            color: var(--captcha-demo-muted);
            line-height: 1.55;
          }
          
          .captcha-demo-card {
            margin: 1.5rem 0 0;
            border: 1px solid #dfe4ec;
            border-radius: 1rem;
            box-shadow: 0 18px 50px rgba(23, 32, 51, .09);
          }
          
          .captcha-demo-form {
            display: grid;
            gap: .9rem;
          }
          
          .captcha-demo-form ion-item {
            --border-color: #dfe4ec;
            --border-radius: .65rem;
            --background: #f9fbfd;
          }
          
          .captcha-demo-widget {
            display: block;
            margin: .35rem 0;
          }
          
          .captcha-demo-status {
            display: block;
            min-height: 1.4rem;
            color: var(--captcha-demo-muted);
            text-align: center;
            line-height: 1.4;
          }
          '
