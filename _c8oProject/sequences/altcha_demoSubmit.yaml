accessibility: Hidden
comment: Demo form submission endpoint. Receives business form data and delegates CAPTCHA validation to the private altcha_verifyPayload sequence. The submission is accepted only for the captcha-demo action with replay prevention enabled.
↓PrepareCaptchaPolicy [steps.SimpleStep-1787242443423]: 
  comment: Defines server-owned verification policy values before invoking the private verifier.
  expression: |
    preventReplay = 'true';
    expectedAction = 'captcha-demo';
↓VerifyCaptcha [steps.SequenceStep-1787242425685]: 
  comment: Calls the private ALTCHA verifier. Its internal document is kept as a source but is not exposed by the business sequence.
  sourceSequence: lib_Captcha.altcha_verifyPayload
  ↓payload [variables.StepVariable-1787242425687]: 
    comment: Forwards the incoming ALTCHA payload to the private verifier.
    required: true
  ↓preventReplay [variables.StepVariable-1787242425689]: 
    comment: Enables node-local one-time payload replay prevention.
    value: true
  ↓expectedAction [variables.StepVariable-1787242425691]: 
    comment: Requires the challenge action used by the demo SharedComponent.
    value: captcha-demo
